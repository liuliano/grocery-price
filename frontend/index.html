<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BasketIQ">
  <title>BasketIQ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/grocery-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/grocery-icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <img class="brand-icon" src="icons/grocery-icon.svg" alt="">
      <div>
        <p class="eyebrow">SMART GROCERY SAVINGS</p>
        <h1>BasketIQ</h1>
        <p class="subtitle">Compare Walmart, Publix, Aldi, and Sam's Club near 33579.</p>
      </div>
    </header>

    <section class="search-panel">
      <label for="productSearch">What are you shopping for?</label>
      <div class="search-row">
        <input id="productSearch" type="search" placeholder="Cheddar cheese, milk, chicken…" autocomplete="off" enterkeyhint="search">
        <button id="searchPrices" type="button">Search prices</button>
      </div>
      <div class="suggestions" aria-label="Popular searches">
        <button type="button" data-query="cheddar cheese">Cheddar cheese</button>
        <button type="button" data-query="whole milk 1 gallon">Milk</button>
        <button type="button" data-query="large eggs 12 count">Eggs</button>
        <button type="button" data-query="boneless chicken breast">Chicken</button>
      </div>
      <p id="status" class="status" aria-live="polite">Enter one grocery item to compare prices.</p>
    </section>

    <section id="bestResult" class="best-result" hidden>
      <span>Best price</span>
      <strong id="bestPrice">—</strong>
      <p id="bestStore">Waiting for results</p>
    </section>

    <section id="results" class="results"></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
