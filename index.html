<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BasketIQ">
  <title>BasketIQ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/grocery-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/grocery-icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="brand-lockup">
        <img class="brand-icon" src="icons/grocery-icon.svg" alt="">
        <div><p class="eyebrow">SMART GROCERY SAVINGS</p><h1>BasketIQ</h1><p class="subtitle">ZIP 33579 · Walmart · Publix · Aldi · Sam's Club</p></div>
      </div>
    </header>

    <section class="dashboard-grid" aria-label="Savings dashboard">
      <article class="metric-card"><span>Estimated savings</span><strong>—</strong><small>after price refresh</small></article>
      <article class="metric-card"><span>Cheapest store</span><strong>—</strong><small>basket winner</small></article>
      <article class="metric-card"><span>Basket total</span><strong>—</strong><small>current list</small></article>
      <article class="metric-card"><span>Last refresh</span><strong>—</strong><small>live prices</small></article>
    </section>

    <section class="quick-actions">
      <button class="quick-card" type="button" data-scroll="shopping"><span>🛒</span><b>Shopping list</b></button>
      <button class="quick-card" id="loadMeal" type="button"><span>🌮</span><b>Taco night</b></button>
      <button class="quick-card" type="button" data-scroll="results"><span>💲</span><b>Compare</b></button>
    </section>

    <section class="panel" id="shopping">
      <div class="section-heading"><div><p class="section-kicker">PLAN YOUR BASKET</p><h2>Shopping list</h2></div><span class="zip-pill">33579</span></div>
      <textarea id="shoppingList" rows="7" placeholder="whole milk 1 gallon&#10;large eggs 12 count&#10;boneless chicken breast"></textarea>
      <div class="button-grid">
        <button id="saveList" type="button">Save on phone</button>
        <button id="refreshDisplayedPrices" class="refresh" type="button">Reload latest prices</button>
      </div>
      <button id="runPriceUpdate" class="workflow-button" type="button">Run price update in GitHub</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="summary" class="summary-grid"></section>
    <section id="results" class="results"></section>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <button type="button" class="active" data-scroll="top"><span>⌂</span>Home</button>
    <button type="button" data-scroll="shopping"><span>🛒</span>List</button>
    <button type="button" id="mealNav"><span>🍽</span>Meals</button>
    <button type="button" data-scroll="results"><span>💲</span>Compare</button>
  </nav>

  <script type="module" src="js/app.js"></script>
  <script>
    document.addEventListener('click', event => {
      const target = event.target.closest('[data-scroll]');
      if (!target) return;
      const id = target.dataset.scroll;
      (id === 'top' ? document.body : document.getElementById(id))?.scrollIntoView({behavior:'smooth'});
    });
  </script>
</body>
</html>
